name = "pdf-insight-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
# Tried in order: the next one is used when a model is overloaded, out of quota or retired.
GEMINI_MODELS = "gemini-3.8-flash,gemini-3.5-flash,gemini-flash-latest"
# Only the GitHub Pages demo may call the API. Local dev overrides this in .dev.vars.
ALLOWED_ORIGINS = "https://imhlux.github.io"

# GEMINI_API_KEY is a secret: `npx wrangler secret put GEMINI_API_KEY --config worker/wrangler.toml`

# 5 analyses per minute per IP address.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 5
  period = 60
